# Quick checks on every push and pull request, on Linux in a few minutes: the
# patches still apply to the pinned Chromium, and the shell typechecks, passes
# its tests and works in a real Chromium. The browser itself is built by
# build.yml (hours, in stages), or locally with chromium/scripts.
name: check
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patches apply to the pinned Chromium
        run: npm run check-patches
      - run: npm run typecheck
      - run: npm test
      - run: npm run shell:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
