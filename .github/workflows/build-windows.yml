# Builds Unveil for Windows x64: the installer and a portable zip.
#
# A Chromium build takes far longer than one GitHub-hosted job may run (6 h),
# so, as in ungoogled-chromium-windows, it runs as a chain of stages: each runs
# build.py --ci for up to 3.5 hours, then hands the half-built tree to the next
# one as an artifact. A full build takes about 8 to 12 stages.
#
# It runs on version tags (v*) and by hand (Actions > build-windows > Run
# workflow). A tag also publishes a GitHub release with the two files.
name: build-windows
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:

  build-1:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: false
          from_artifact: false
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-2:
    needs: build-1
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.build-1.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-3:
    needs: build-2
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.build-2.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-4:
    needs: build-3
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.build-3.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-5:
    needs: build-4
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.build-4.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-6:
    needs: build-5
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.build-5.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-7:
    needs: build-6
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.build-6.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-8:
    needs: build-7
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.build-7.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-9:
    needs: build-8
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.build-8.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-10:
    needs: build-9
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.build-9.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-11:
    needs: build-10
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.build-10.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-12:
    needs: build-11
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.build-11.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-13:
    needs: build-12
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.build-12.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-14:
    needs: build-13
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.build-13.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-15:
    needs: build-14
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.build-14.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-16:
    needs: build-15
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.build-15.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  complete:
    needs: build-16
    runs-on: ubuntu-latest
    steps:
      - name: Ensure build finished
        run: |
          if [ "${{ needs.build-16.outputs.finished }}" != "true" ]; then
            echo "Build did not finish after 16 stages."
            exit 1
          fi

  release:
    needs: complete
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: unveil
          path: dist
      - name: Checksums
        run: cd dist && sha256sum unveil_* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
