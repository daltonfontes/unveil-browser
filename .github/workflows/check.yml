# Quick checks on every push and pull request, on Linux in a few minutes, so a
# broken patch or shell shows up before a day-long Windows build.
name: check
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Unveil's patches apply to the pinned Chromium
        run: python3 tools/check_patches.py

  shell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shell/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
